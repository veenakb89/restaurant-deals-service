spring.application.name=restaurant-deals-service
# Filled in from pom.xml at build time (Maven resource filtering); shown as the API version in Swagger
app.version=@project.version@
server.port=8080

# Upstream restaurant feed
restaurant-feed.url=https://eccdn.com.au/misc/challengedata.json
restaurant-feed.connect-timeout=5s
restaurant-feed.read-timeout=10s

# JWTs issued by POST /oauth2/token (demo issuer, HS256).
# The default secret is for local runs only; set JWT_SECRET (32+ characters) anywhere else.
security.jwt.issuer=restaurant-deals
security.jwt.audience=deals-api
security.jwt.subject=demo-client
# Put in issued tokens, and required by the deals endpoints (/api/**)
security.jwt.scope=deals:read
security.jwt.token-ttl=1h

# ideally secrets should be from secrets manager
security.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-at-least-32-chars}
